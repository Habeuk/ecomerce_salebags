langcode: fr
status: true
dependencies:
  module:
    - commerce_payment
    - commerce_paypal
    - commerce_shipping
    - commerce_stripe
    - stripebyhabeuk
_core:
  default_config_hash: KDnx5MjFtp3-Rb0dGzCCzQEabHgvxrzxpkMrbOKsg_4
label: Expédition
id: shipping
plugin: multistep_default
configuration:
  display_checkout_progress: true
  display_checkout_progress_breadcrumb_links: true
  guest_order_assign: false
  guest_new_account: false
  guest_new_account_notify: false
  panes:
    login:
      step: login
      weight: 0
      allow_guest_checkout: true
      allow_registration: false
      registration_form_mode: register
    contact_information:
      step: order_information
      weight: 1
      double_entry: false
    shipping_information:
      step: order_information
      weight: 2
      auto_recalculate: true
      require_shipping_profile: true
    payment_information:
      step: order_information
      weight: 3
    review:
      step: review
      weight: 4
    stripe_review:
      step: review
      weight: 5
      button_id: edit-actions-next
      auto_submit_review_form: false
      setup_future_usage: ''
    stripebyhabeuk_review:
      step: review
      weight: 6
    payment_process:
      step: payment
      weight: 7
      capture: true
    paypal_checkout_payment_process:
      step: payment
      weight: 8
      capture: true
    completion_message:
      step: complete
      weight: 9
      message:
        value: "Your order number is [commerce_order:order_number].\r\nYou can view your order on your account page when logged in."
        format: plain_text
    order_summary:
      step: _sidebar
      weight: 10
      view: commerce_checkout_order_summary
    customer_comments:
      step: _disabled
      weight: 11
    completion_register:
      step: _disabled
      weight: 12
