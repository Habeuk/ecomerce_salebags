langcode: fr
status: true
dependencies:
  config:
    - field.storage.commerce_product.body
    - field.storage.commerce_product.field_collections
    - field.storage.commerce_product_variation.field_niveau_de_stock
    - search_api.server.serveur_produit
  module:
    - commerce_product
    - taxonomy
id: recherche_de_produits
name: 'Recherche de produits'
description: ''
read_only: false
field_settings:
  body:
    label: 'Description courte'
    datasource_id: 'entity:commerce_product'
    property_path: body
    type: text
    dependencies:
      config:
        - field.storage.commerce_product.body
  changed:
    label: Modifié
    datasource_id: 'entity:commerce_product'
    property_path: changed
    type: date
    dependencies:
      module:
        - commerce_product
  created:
    label: Créé
    datasource_id: 'entity:commerce_product'
    property_path: created
    type: date
    dependencies:
      module:
        - commerce_product
  field_collections:
    label: Collection
    datasource_id: 'entity:commerce_product'
    property_path: field_collections
    type: integer
    dependencies:
      config:
        - field.storage.commerce_product.field_collections
  field_niveau_de_stock:
    label: 'Default variation » Variation de produit » Niveau de stock'
    datasource_id: 'entity:commerce_product'
    property_path: 'default_variation:entity:field_niveau_de_stock'
    type: decimal
    dependencies:
      config:
        - field.storage.commerce_product_variation.field_niveau_de_stock
      module:
        - commerce_product
  name:
    label: 'Collection » Terme de taxonomie » Nom'
    datasource_id: 'entity:commerce_product'
    property_path: 'field_collections:entity:name'
    type: text
    dependencies:
      config:
        - field.storage.commerce_product.field_collections
      module:
        - taxonomy
  number:
    label: 'Default variation » Variation de produit » Prix » Nombre'
    datasource_id: 'entity:commerce_product'
    property_path: 'default_variation:entity:price:number'
    type: decimal
    dependencies:
      module:
        - commerce_product
  status:
    label: Publié
    datasource_id: 'entity:commerce_product'
    property_path: status
    type: boolean
    dependencies:
      module:
        - commerce_product
  title:
    label: 'Default variation » Variation de produit » Titre'
    datasource_id: 'entity:commerce_product'
    property_path: 'default_variation:entity:title'
    type: text
    dependencies:
      module:
        - commerce_product
  title_1:
    label: Titre
    datasource_id: 'entity:commerce_product'
    property_path: title
    type: text
    boost: 8.0
    dependencies:
      module:
        - commerce_product
  uid:
    label: Auteur
    datasource_id: 'entity:commerce_product'
    property_path: uid
    type: integer
    dependencies:
      module:
        - commerce_product
datasource_settings:
  'entity:commerce_product':
    bundles:
      default: false
      selected:
        - sacs_prestige
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  custom_value: {  }
  entity_type: {  }
  html_filter:
    weights:
      preprocess_index: -15
      preprocess_query: -15
    all_fields: false
    fields:
      - body
      - name
      - title
      - title_1
    title: true
    alt: true
    tags:
      b: 2
      h1: 5
      h2: 3
      h3: 2
      strong: 2
  ignore_character:
    weights:
      preprocess_index: -10
      preprocess_query: -10
    all_fields: false
    fields:
      - body
      - name
      - title
      - title_1
    ignorable: "['¿¡!?,.:;]"
    ignorable_classes:
      - Pc
      - Pd
      - Pe
      - Pf
      - Pi
      - Po
      - Ps
  ignorecase:
    weights:
      preprocess_index: -20
      preprocess_query: -20
    all_fields: false
    fields:
      - body
      - name
      - title
      - title_1
  language_with_fallback: {  }
  rendered_item: {  }
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  delete_on_fail: true
  index_directly: true
  track_changes_in_references: true
server: serveur_produit
